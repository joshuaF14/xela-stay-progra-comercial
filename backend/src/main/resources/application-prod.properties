# Perfil de producción (Render, plan Free: 512 MB y 0.1 CPU). Se activa con SPRING_PROFILES_ACTIVE=prod.
# Todo valor sensible llega por variables de entorno del servicio; nada secreto en este archivo.

# --- Base de datos ----------------------------------------------------------------------------------------------
# Las migraciones nunca corren en producción: se aplican a mano (docs/database/SUPABASE_FLYWAY.md).
spring.flyway.enabled=false
spring.jpa.show-sql=false

# Supabase Session pooler: 15 clientes para todo el proyecto, compartidos con el equipo en local.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
# Espera máxima por una conexión libre y por la validación.
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
# Conexiones ociosas se cierran a los 2 min; ninguna vive más de 10 min (el pooler puede cortar las antiguas).
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000
# Ping cada 5 min a las ociosas para detectar cortes del pooler antes de usarlas.
spring.datasource.hikari.keepalive-time=300000

# --- RabbitMQ (CloudAMQP) -----------------------------------------------------------------------------------------
# URL completa amqps://usuario:clave@host/vhost: con amqps Spring activa TLS (puerto 5671) y toma usuario y vhost.
# Con EVENTS_ENABLED=false no se crean publicador ni consumidor y la aplicación arranca sin broker.
spring.rabbitmq.addresses=${RABBITMQ_URL:}
spring.rabbitmq.connection-timeout=10s

# --- Web ----------------------------------------------------------------------------------------------------------
# Origen del frontend en Render (obligatorio en producción: sin valor por defecto).
xelastay.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
# Render es un proxy: usa X-Forwarded-For/Proto para la IP real del cliente (auditoría) y el esquema https.
server.forward-headers-strategy=framework
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain
# Menos hilos que el valor por defecto (200): suficiente para la demo y menos memoria.
server.tomcat.threads.max=40
server.error.include-stacktrace=never
server.error.include-message=never

# --- Logs ---------------------------------------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.xelastay=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# --- Actuator -----------------------------------------------------------------------------------------------------
# Solo health y solo el estado general (UP/DOWN), sin componentes ni detalles.
# El health check de Render usa /api/health, que no depende de base de datos, RabbitMQ ni Gemini.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-components=never
management.endpoint.health.show-details=never
