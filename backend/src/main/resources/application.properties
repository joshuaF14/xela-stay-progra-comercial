# Configuración inicial del backend
spring.application.name=xela-stay-backend
# Versión tomada del pom.xml al compilar (filtrado de recursos de Spring Boot).
xelastay.version=@project.version@

# Carga opcional del .env local (raíz del repo al ejecutar desde backend/, o directorio actual).
# Las variables de entorno del sistema tienen prioridad sobre estos archivos.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# Perfil y puerto: se leen de SPRING_PROFILES_ACTIVE y SERVER_PORT (entorno o .env).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
server.port=${SERVER_PORT:8080}
# Fuerza charset=UTF-8 en las respuestas (las tildes se ven bien en PowerShell y otros clientes).
server.servlet.encoding.force=true

# No usar credenciales de Supabase en archivos versionados.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
# Session pooler de Supabase: 15 clientes para todo el proyecto, compartidos por el equipo.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}

# Deshabilitado por defecto; habilitar únicamente para una ejecución aprobada.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Orígenes permitidos para CORS, separados por coma.
xelastay.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT de Supabase Auth (llaves asimétricas vía JWKS). Sin estos valores la aplicación no arranca.
xelastay.security.jwt.jwks-uri=${SUPABASE_JWKS_URI:}
xelastay.security.jwt.issuer=${SUPABASE_JWT_ISSUER:}
xelastay.security.jwt.audience=authenticated

# RabbitMQ local (docker-compose.yml). Host, puerto y credenciales desde el .env.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
# Confirmaciones del broker: un evento del outbox se marca PUBLISHED solo cuando RabbitMQ lo aceptó.
spring.rabbitmq.publisher-confirm-type=simple
# Consumidores: 3 intentos; si siguen fallando, el mensaje pasa a la DLQ (no se reencola).
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Outbox -> RabbitMQ. Con EVENTS_ENABLED=false no se publica ni se consume (los eventos quedan PENDING).
xelastay.events.enabled=${EVENTS_ENABLED:true}
xelastay.events.publish-interval-ms=5000
xelastay.events.batch-size=20
xelastay.events.max-attempts=10
management.health.rabbit.enabled=${EVENTS_ENABLED:true}

# Agente de IA con RAG (Gemini). AI_API_KEY va solo en el .env; sin ella, /api/v1/ai/chat responde 503.
xelastay.ai.api-key=${AI_API_KEY:}
xelastay.ai.model=${AI_MODEL:gemini-3.8-flash}
xelastay.ai.base-url=https://generativelanguage.googleapis.com/v1beta
xelastay.ai.max-chunks=5
xelastay.ai.chunk-words=800
xelastay.ai.chunk-overlap-words=100

# Actuator: solo se expone health, con el estado de cada componente (p. ej. db) sin detalles internos.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-components=always
management.endpoint.health.show-details=never
