# Configuración inicial del backend
spring.application.name=xela-stay-backend
# Versión tomada del pom.xml al compilar (filtrado de recursos de Spring Boot).
xelastay.version=@project.version@

# Carga opcional del .env local (raíz del repo al ejecutar desde backend/, o directorio actual).
# Las variables de entorno del sistema tienen prioridad sobre estos archivos.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# Perfil y puerto: se leen de SPRING_PROFILES_ACTIVE y SERVER_PORT (entorno o .env).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
server.port=${SERVER_PORT:8080}

# No usar credenciales de Supabase en archivos versionados.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Deshabilitado por defecto; habilitar únicamente para una ejecución aprobada.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Orígenes permitidos para CORS, separados por coma.
xelastay.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT de Supabase Auth (llaves asimétricas vía JWKS). Sin estos valores la aplicación no arranca.
xelastay.security.jwt.jwks-uri=${SUPABASE_JWKS_URI:}
xelastay.security.jwt.issuer=${SUPABASE_JWT_ISSUER:}
xelastay.security.jwt.audience=authenticated

# Actuator: solo se expone health, con el estado de cada componente (p. ej. db) sin detalles internos.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-components=always
management.endpoint.health.show-details=never
